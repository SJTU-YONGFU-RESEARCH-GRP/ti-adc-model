[project]
name = "ti-adc-model"
version = "0.1.0"
description = "Time-interleaved ADC behavioral model, analysis, and multi-engine testbenches"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "adc-model",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ti_adc"]

[tool.uv.sources]
adc-model = { git = "ssh://git@github.com/SJTU-YONGFU-RESEARCH-GRP/adc-model.git", rev = "8e071dfaafeb2958b770c1d2369845bf9ba820b9", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
